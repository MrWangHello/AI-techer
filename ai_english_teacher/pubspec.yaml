name: ai_english_teacher
description: AI English Teacher App for elementary students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Router
  go_router: ^14.0.0

  # UI Components
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  confetti_widget: ^0.3.1
  rive: ^0.13.0
  flutter_spinkit: ^5.2.0

  # Voice (System native)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Audio
  audioplayers: ^6.0.0

  # Game Engine
  flame: ^1.14.0

  # 3D Models
  model_viewer_plus: ^1.8.0

  # AI Agent Framework (LangChain.dart)
  langchain: ^0.9.0
  langchain_openai: ^0.9.0
  langchain_ollama: ^0.3.0

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Network Detection
  connectivity_plus: ^6.0.3

  # HTTP Client
  dio: ^5.4.0

  # Utilities
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # Charts
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/courses/
    - assets/images/
    - assets/audio/words/
    - assets/audio/sentences/
    - assets/animations/pet/
    - assets/animations/effects/
