# GitHub Pages 部署工作流 + Cloudflare Worker 自动部署
# 推送 main 分支时自动：
# 1. 部署 Edge-TTS Worker 到 Cloudflare
# 2. 获取 Worker URL 传给 Next.js 构建
# 3. 构建静态网站并部署到 GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./ai-english-teacher

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ai-english-teacher/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 部署 Cloudflare Worker 到生产环境
      - name: Deploy Cloudflare Worker
        id: cf-deploy
        working-directory: ./ai-english-teacher/workers
        run: |
          npx --yes wrangler deploy edge-tts.js --name ai-teacher-tts 2>&1 | tee wrangler-output.txt
          # 从输出中提取 Worker URL
          URL=$(grep -oP 'https://[^ ]+\.workers\.dev' wrangler-output.txt | head -1)
          if [ -z "$URL" ]; then
            echo "::warning::Could not extract Worker URL from output"
            URL="https://ai-teacher-tts.example.workers.dev"
          fi
          echo "worker_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed Worker URL: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 提取 Worker URL
      - name: Extract Worker URL
        id: cf-url
        working-directory: ./ai-english-teacher
        run: |
          echo "worker_url=${{ steps.cf-deploy.outputs.worker_url }}" >> $GITHUB_OUTPUT
          echo "Worker URL: ${{ steps.cf-deploy.outputs.worker_url }}"

      # 构建 Next.js，传入 Worker URL 作为环境变量
      - name: Build for GitHub Pages
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_TTS_WORKER_URL: ${{ steps.cf-url.outputs.worker_url }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ai-english-teacher/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4