# GitHub Pages 部署工作流 + Cloudflare Worker 自动部署
# 推送 main 分支时自动：
# 1. 部署 Edge-TTS Worker 到 Cloudflare
# 2. 获取 Worker URL 传给 Next.js 构建
# 3. 构建静态网站并部署到 GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./ai-english-teacher

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ai-english-teacher/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 部署 Cloudflare Worker 到生产环境
      - name: Deploy Cloudflare Worker
        id: cf-deploy
        working-directory: ./ai-english-teacher/workers
        run: |
          set -e  # 临时启用错误退出，但用 || true 处理已知可能失败的步骤

          echo "::group::Deploying Cloudflare Worker via API"

          # 1. 上传 Worker 脚本
          echo "Uploading worker script..."
          UPLOAD_RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ai-teacher-tts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata={\"compatibility_date\":\"2024-12-01\",\"compatibility_flags\":[\"nodejs_compat\"]};type=application/json" \
            -F "script=@edge-tts.js;type=application/javascript")
          echo "$UPLOAD_RESPONSE" | head -5
          if echo "$UPLOAD_RESPONSE" | grep -q '"success":true'; then
            echo "✅ Worker script uploaded successfully"
          else
            echo "⚠️ Worker upload may have failed, checking response..."
            echo "$UPLOAD_RESPONSE"
          fi

          echo "::endgroup::"

          # 2. 尝试启用 workers.dev 子域名（可能因权限失败，但脚本已上传）
          echo "::group::Enabling workers.dev subdomain"
          SUBDOMAIN_RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ai-teacher-tts/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"enabled": true}') || true
          echo "$SUBDOMAIN_RESPONSE" | head -3
          echo "::endgroup::"

          # 3. 获取 Workers 子域名
          echo "::group::Getting Workers Subdomain"
          SUBDOMAIN_INFO=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN") || true
          echo "$SUBDOMAIN_INFO" | head -5
          SUBDOMAIN=$(echo "$SUBDOMAIN_INFO" | grep -oP '"subdomain"\s*:\s*"\K[a-z0-9-]+' | head -1)
          if [ -n "$SUBDOMAIN" ]; then
            URL="https://ai-teacher-tts.$SUBDOMAIN.workers.dev"
            echo "Constructed Worker URL: $URL"
          else
            echo "::warning::Could not determine Workers subdomain from API"
            # 尝试另一种方式获取子域名
            echo "Trying alternative method..."
            # 清除 set -e 的影响
            set +e
            npm install wrangler@3.90.0 2>&1 | tail -3
            WHOAMI=$(npx --no-install wrangler whoami 2>&1) || true
            echo "$WHOAMI"
            SUBDOMAIN=$(echo "$WHOAMI" | grep -oP "Workers\s*·\s*\K[a-z0-9-]+" | head -1)
            if [ -n "$SUBDOMAIN" ]; then
              URL="https://ai-teacher-tts.$SUBDOMAIN.workers.dev"
              echo "Got subdomain from wrangler: $SUBDOMAIN"
            else
              # 最后的兜底：假设 Worker 已部署，使用固定子域名格式
              echo "::warning::Could not determine Workers subdomain, using fallback URL"
              URL="https://ai-teacher-tts.example.workers.dev"
            fi
          fi
          echo "worker_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed Worker URL: $URL"
          echo "::endgroup::"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 03df0c3386c137d3cf1156bc7d8b2eec

      # 构建 Next.js，传入 Worker URL 作为环境变量
      - name: Build for GitHub Pages
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_TTS_WORKER_URL: ${{ steps.cf-deploy.outputs.worker_url }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ai-english-teacher/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4