# GitHub Pages 部署工作流 + Cloudflare Worker 自动部署
# 推送 main 分支时自动：
# 1. 部署 Edge-TTS Worker 到 Cloudflare
# 2. 获取 Worker URL 传给 Next.js 构建
# 3. 构建静态网站并部署到 GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./ai-english-teacher

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ai-english-teacher/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 部署 Cloudflare Worker 到生产环境
      - name: Deploy Cloudflare Worker
        id: cf-deploy
        working-directory: ./ai-english-teacher/workers
        run: |
          echo "::group::Deploying Cloudflare Worker"
          npm install wrangler@3.90.0 2>&1
          OUTPUT=$(npx --no-install wrangler deploy edge-tts.js --name ai-teacher-tts 2>&1) || true
          echo "$OUTPUT"
          echo "::endgroup::"
          # 获取 Workers 子域名
          echo "::group::Getting Workers Subdomain"
          WHOAMI=$(npx --no-install wrangler whoami 2>&1) || true
          echo "$WHOAMI"
          echo "::endgroup::"
          # 从 whoami 输出中提取 Workers 子域名（格式: user@example.com's Workers · subdomain.workers.dev）
          SUBDOMAIN=$(echo "$WHOAMI" | grep -oP "Workers\s*·\s*\K[a-z0-9-]+" | head -1)
          if [ -n "$SUBDOMAIN" ]; then
            URL="https://ai-teacher-tts.$SUBDOMAIN.workers.dev"
            echo "Constructed Worker URL: $URL"
          else
            echo "::warning::Could not determine Workers subdomain"
            URL="https://ai-teacher-tts.example.workers.dev"
          fi
          echo "worker_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed Worker URL: $URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 03df0c3386c137d3cf1156bc7d8b2eec

      # 构建 Next.js，传入 Worker URL 作为环境变量
      - name: Build for GitHub Pages
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          NEXT_PUBLIC_TTS_WORKER_URL: ${{ steps.cf-deploy.outputs.worker_url }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ai-english-teacher/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4