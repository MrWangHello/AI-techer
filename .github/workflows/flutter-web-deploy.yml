name: Flutter Web Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: cd ai_english_teacher_flutter && flutter pub get

      - name: Build Flutter Web
        run: cd ai_english_teacher_flutter && flutter build web --release --base-href "/AI-techer/" --web-renderer html

      - name: Copy GLB model to build output
        run: |
          mkdir -p ai_english_teacher_flutter/build/web/assets/models
          cp ai_english_teacher_flutter/assets/models/*.glb ai_english_teacher_flutter/build/web/assets/models/
          echo "Copied models:"
          ls -la ai_english_teacher_flutter/build/web/assets/models/

      - name: Bump Service Worker cache version and bust Flutter bootstrap cache
        run: |
          SW_FILE="ai_english_teacher_flutter/build/web/flutter_service_worker.js"
          INDEX_FILE="ai_english_teacher_flutter/build/web/index.html"
          TIMESTAMP=$(date +%s)
          # 1. 更新 Service Worker 缓存名称
          sed -i "s/CACHE_NAME = 'flutter-app-cache'/CACHE_NAME = 'flutter-app-cache-${TIMESTAMP}'/" "$SW_FILE"
          echo "Updated service worker cache name:"
          grep "CACHE_NAME" "$SW_FILE"
          # 2. 给 flutter_bootstrap.js 添加版本号参数，强制浏览器不缓存
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=${TIMESTAMP}\"|" "$INDEX_FILE"
          # 3. 也给 main.dart.js 添加版本号参数
          sed -i "s|src=\"main.dart.js\"|src=\"main.dart.js?v=${TIMESTAMP}\"|" "$INDEX_FILE"
          echo "Updated index.html references:"
          grep -o 'src="[^"]*\.js?v=[0-9]*"' "$INDEX_FILE" || echo "No JS with version found"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai_english_teacher_flutter/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
