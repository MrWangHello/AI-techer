<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Model Viewer Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .loading { background: #fff3cd; color: #856404; }
    model-viewer { width: 100%; height: 500px; }
  </style>
</head>
<body>
  <h1>Model Viewer 测试页面</h1>
  <div id="status" class="loading">正在加载 model-viewer...</div>
  <div id="webgl-status"></div>
  
  <model-viewer
    id="test-viewer"
    src="assets/models/RobotExpressive.glb"
    camera-controls
    auto-rotate
    shadow-intensity="0.5"
    style="width: 100%; height: 500px;">
  </model-viewer>

  <script type="module" src="model-viewer.min.js"></script>
  <script type="module">
    const statusDiv = document.getElementById('status');
    const webglStatusDiv = document.getElementById('webgl-status');
    const viewer = document.getElementById('test-viewer');

    // 检测 WebGL 支持
    function checkWebGL() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          webglStatusDiv.innerHTML = '<div class="success">✓ WebGL 支持正常</div>';
          return true;
        } else {
          webglStatusDiv.innerHTML = '<div class="error">✗ 当前浏览器不支持 WebGL</div>';
          return false;
        }
      } catch (e) {
        webglStatusDiv.innerHTML = '<div class="error">✗ WebGL 检测失败: ' + e.message + '</div>';
        return false;
      }
    }

    // 检测 model-viewer 是否注册
    function checkModelViewer() {
      if (customElements.get('model-viewer')) {
        statusDiv.textContent = '✓ model-viewer 自定义元素已注册';
        statusDiv.className = 'success';
        return true;
      } else {
        statusDiv.textContent = '✗ model-viewer 自定义元素未注册';
        statusDiv.className = 'error';
        return false;
      }
    }

    // 监听模型加载事件
    viewer.addEventListener('load', () => {
      const loadStatus = document.createElement('div');
      loadStatus.className = 'success';
      loadStatus.textContent = '✓ 3D 模型加载成功';
      loadStatus.style.padding = '10px';
      loadStatus.style.margin = '10px 0';
      document.body.insertBefore(loadStatus, viewer);
    });

    viewer.addEventListener('error', (e) => {
      const errorStatus = document.createElement('div');
      errorStatus.className = 'error';
      errorStatus.textContent = '✗ 3D 模型加载失败: ' + (e.detail || '未知错误');
      errorStatus.style.padding = '10px';
      errorStatus.style.margin = '10px 0';
      document.body.insertBefore(errorStatus, viewer);
    });

    // 延迟检查，等待 model-viewer 加载
    setTimeout(() => {
      checkWebGL();
      checkModelViewer();
    }, 2000);
  </script>
</body>
</html>
