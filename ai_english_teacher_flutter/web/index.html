<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI English Teacher - 3D Pet Companion">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI English Teacher">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI English Teacher</title>
  <link rel="manifest" href="manifest.json">

  <!-- Load model-viewer with multiple CDN fallbacks -->
  <script>
    (function() {
      var scripts = [
        'https://cdn.jsdelivr.net/npm/@google/model-viewer@3.3.0/dist/model-viewer.min.js',
        'https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js'
      ];
      function loadScript(index) {
        if (index >= scripts.length) {
          console.error('All model-viewer CDNs failed');
          return;
        }
        var s = document.createElement('script');
        s.src = scripts[index];
        s.onload = function() { console.log('model-viewer loaded from: ' + scripts[index]); };
        s.onerror = function() { console.warn('Failed: ' + scripts[index] + ', trying next...'); loadScript(index + 1); };
        document.head.appendChild(s);
      }
      loadScript(0);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
