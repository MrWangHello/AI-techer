<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI English Teacher - 3D Pet Companion">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI English Teacher">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI English Teacher</title>
  <link rel="manifest" href="manifest.json">

  <!-- Load model-viewer from local file (ES module) -->
  <script type="module">
    // WebGL 检测
    function checkWebGLSupport() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        return gl !== null;
      } catch (e) {
        return false;
      }
    }

    // 等待 DOM 加载完成
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('model-viewer-container');
      const viewer = document.getElementById('pet-model');
      
      if (!checkWebGLSupport()) {
        console.warn('WebGL 不支持，显示降级内容');
        container.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: center; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; padding: 20px;">
            <div>
              <h2 style="margin-bottom: 10px;">🎮 3D 模型需要 WebGL 支持</h2>
              <p>您的浏览器不支持 WebGL，无法显示 3D 宠物模型</p>
              <p style="margin-top: 10px; font-size: 14px; opacity: 0.9;">请使用 Chrome、Firefox 或 Edge 浏览器访问</p>
            </div>
          </div>
        `;
        container.classList.add('active');
        return;
      }

      // 动态加载 model-viewer
      import('./model-viewer.min.js')
        .then(() => {
          console.log('model-viewer 加载成功');
          container.classList.add('active');
        })
        .catch((err) => {
          console.error('model-viewer 加载失败:', err);
          container.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; background: #f5f5f5; color: #666; text-align: center; padding: 20px;">
              <div>
                <h2 style="margin-bottom: 10px;">⚠️ 3D 模型加载失败</h2>
                <p>请稍后刷新页面重试</p>
              </div>
            </div>
          `;
          container.classList.add('active');
        });
    });
  </script>
  <style>
    #model-viewer-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: white;
      display: none;
    }
    #model-viewer-container.active {
      display: block;
    }
    #model-viewer-container model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- 3D Model Viewer -->
  <div id="model-viewer-container">
    <model-viewer
      id="pet-model"
      src="assets/models/RobotExpressive.glb"
      camera-controls
      auto-rotate
      shadow-intensity="0.5"
      animation-name="Idle"
      camera-orbit="0deg 75deg 105%"
      field-of-view="30deg">
    </model-viewer>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Communication between Flutter and model-viewer -->
  <script>
    (function() {
      var container = document.getElementById('model-viewer-container');
      var viewer = document.getElementById('pet-model');
      var isVisible = false;
      
      // 监听来自 model-viewer 的事件
      viewer.addEventListener('load', function() {
        window.postMessage({type: 'mv-load'}, '*');
      });
      viewer.addEventListener('error', function(e) {
        window.postMessage({type: 'mv-error', error: 'Failed to load model'}, '*');
      });
      viewer.addEventListener('click', function() {
        window.postMessage({type: 'mv-tap'}, '*');
      });
      
      // 监听来自 Flutter 的消息
      window.addEventListener('message', function(event) {
        if (!event.data || !event.data.type) return;
        
        if (event.data.type === 'show-model') {
          container.classList.add('active');
          if (event.data.animation) {
            viewer.setAttribute('animation-name', event.data.animation);
          }
          isVisible = true;
        } else if (event.data.type === 'hide-model') {
          container.classList.remove('active');
          isVisible = false;
        } else if (event.data.type === 'set-animation') {
          viewer.setAttribute('animation-name', event.data.animation);
        } else if (event.data.type === 'pause-animation') {
          viewer.setAttribute('paused', '');
        } else if (event.data.type === 'resume-animation') {
          viewer.removeAttribute('paused');
        }
      });
    })();
  </script>
</body>
</html>
