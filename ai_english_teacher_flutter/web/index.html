<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI English Teacher - 3D Pet Companion">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI English Teacher">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI English Teacher</title>
  <link rel="manifest" href="manifest.json">

  <!-- 预加载样式：立即显示加载动画 -->
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f0eb;
    }
    /* 加载中动画 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f0eb;
      z-index: 99998;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0d5cc;
      border-top: 4px solid #ff6b6b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-screen p {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: #999;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* 微信浏览器引导遮罩 */
    #wechat-guide {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    #wechat-guide.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #wechat-guide h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    #wechat-guide p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    #wechat-guide .btn {
      display: inline-block;
      padding: 14px 40px;
      background: #07c160;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    #wechat-guide .tip {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!-- 加载中动画 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>

  <!-- 微信浏览器引导页面（默认隐藏，仅在微信移动端显示） -->
  <div id="wechat-guide" style="display:none;">
    <h2>&#128274; 请在浏览器中打开</h2>
    <p>当前页面在微信中无法正常显示 3D 内容。<br>
    请点击右上角 <strong>"..."</strong>，选择<br>
    <strong>"在浏览器中打开"</strong> 获得最佳体验。</p>
    <a class="btn" href="#" onclick="document.getElementById('wechat-guide').style.display='none'; return false;">我已了解，继续访问</a>
    <p class="tip">推荐使用 Chrome、QQ 浏览器或手机自带浏览器</p>
  </div>

  <!-- Three.js + GLTFLoader - 异步加载，不阻塞渲染 -->
  <script defer src="three.min.js"></script>
  <script defer src="GLTFLoader.js"></script>
  <script defer src="three-loader.js"></script>

  <script>
    // 页面加载完成后隐藏 loading 动画
    window.addEventListener('load', function() {
      var loading = document.getElementById('loading-screen');
      if (loading) {
        setTimeout(function() {
          loading.classList.add('hidden');
          setTimeout(function() { loading.style.display = 'none'; }, 500);
        }, 3000);
      }
    });
    // 3D 模型加载完成后提前隐藏 loading 动画
    document.addEventListener('three-loaded', function() {
      var loading = document.getElementById('loading-screen');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(function() { loading.style.display = 'none'; }, 500);
      }
    });
  </script>

  <!-- Flutter 应用入口 -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
