<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI English Teacher - Live2D Pet Companion">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI English Teacher">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI English Teacher</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f0eb;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f0eb;
      z-index: 99998;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0d5cc;
      border-top: 4px solid #ff6b6b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-screen p {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: #999;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #wechat-guide {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    #wechat-guide.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #wechat-guide h2 { font-size: 24px; margin-bottom: 20px; }
    #wechat-guide p { font-size: 16px; line-height: 1.6; margin-bottom: 30px; opacity: 0.9; }
    #wechat-guide .btn {
      display: inline-block;
      padding: 14px 40px;
      background: #07c160;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    #wechat-guide .tip { margin-top: 20px; font-size: 14px; opacity: 0.7; }
    .live2d-viewer canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>

  <div id="wechat-guide" style="display:none;">
    <h2>&#128274; 请在浏览器中打开</h2>
    <p>当前页面在微信中无法正常显示互动内容。<br>
    请点击右上角 <strong>"..."</strong>，选择<br>
    <strong>"在浏览器中打开"</strong> 获得最佳体验。</p>
    <a class="btn" href="#" onclick="document.getElementById('wechat-guide').style.display='none'; return false;">我已了解，继续访问</a>
    <p class="tip">推荐使用 Chrome、QQ 浏览器或手机自带浏览器</p>
  </div>

  <!-- ======== Live2D 库（同步加载，确保 Flutter 启动前就绪） ======== -->
  <script>
  // 标记：Live2D 加载器是否就绪
  window.__live2dReady = false;
  // 加载队列
  var __l2dScripts = [
    'https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js',
    'https://cdn.jsdelivr.net/npm/pixi.js-legacy@6.5.10/dist/browser/pixi-legacy.js',
    'https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism2.min.js',
  ];
  var __l2dLoaded = 0;
  function __l2dOnLoad() {
    __l2dLoaded++;
    if (__l2dLoaded >= __l2dScripts.length) {
      window.__live2dReady = true;
      // 触发 live2d-ready 事件
      document.dispatchEvent(new Event('live2d-ready'));
      // 加载 live2d-loader.js
      var loader = document.createElement('script');
      loader.src = 'live2d-loader.js';
      loader.async = false;
      document.body.appendChild(loader);
    }
  }
  // 开始加载（添加 crossorigin 以便获取详细错误信息）
  for (var i = 0; i < __l2dScripts.length; i++) {
    var s = document.createElement('script');
    s.src = __l2dScripts[i];
    s.async = false;
    s.crossOrigin = 'anonymous';
    s.onload = __l2dOnLoad;
    s.onerror = function() { console.warn('Live2D lib load failed, skipping: ' + __l2dScripts[__l2dLoaded]); __l2dOnLoad(); };
    document.head.appendChild(s);
  }
  </script>

  <script>
  // ======== 手机端语音修复（用户手势解锁音频 + QQ 浏览器兼容） ========
  (function() {
    var audioUnlocked = false;
    var speechReady = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      // 1. 解锁 AudioContext
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        gain.gain.value = 0.001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0);
        osc.stop(0.001);
      } catch(e) {}
      // 2. 预激活 SpeechSynthesis（QQ 浏览器需要多次尝试）
      function trySpeech() {
        if (speechReady) return;
        try {
          if ('speechSynthesis' in window) {
            var u = new SpeechSynthesisUtterance(' ');
            u.volume = 0;
            speechSynthesis.speak(u);
            setTimeout(function() {
              speechSynthesis.cancel();
              speechReady = true;
            }, 100);
          }
        } catch(e) {}
      }
      trySpeech();
      // QQ 浏览器可能需要多次尝试
      setTimeout(trySpeech, 500);
      setTimeout(trySpeech, 1000);
      // 预加载语音列表
      if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
      }
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    }
    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);
    document.addEventListener('keydown', unlockAudio);
    // 页面加载完也尝试（但可能被浏览器限制）
    setTimeout(unlockAudio, 3000);
  })();

  // ======== 语音朗读（兼容手机端 + QQ 浏览器） ========
  window.speakWord = function(word, lang) {
    lang = lang || 'en-US';
    // 尝试 speechSynthesis
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(word);
        u.lang = lang;
        u.rate = 0.85;
        u.pitch = 1.0;
        u.volume = 1.0;
        if (lang === 'zh-CN') {
          var voices = window.speechSynthesis.getVoices();
          var zhVoice = voices.find(function(v) { return v.lang.indexOf('zh') === 0; });
          if (zhVoice) u.voice = zhVoice;
        }
        // 延时+重试：QQ 浏览器需要多次尝试
        var retries = 0;
        function doSpeak() {
          try {
            window.speechSynthesis.speak(u);
          } catch(e) {
            if (retries < 3) {
              retries++;
              setTimeout(doSpeak, 300);
            }
          }
        }
        setTimeout(doSpeak, 200);
        return true;
      } catch(e) {
        console.warn('speakWord error:', e);
      }
    }
    // 降级：尝试使用 Web Audio API 生成提示音（移动端浏览器常用）
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      // 简单的提示音表示有语音
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 600;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
      console.log('SpeechSynthesis not available, playing beep instead');
    } catch(e) {
      console.warn('AudioContext fallback also failed:', e);
    }
    return false;
  };

  // ======== 页面加载完成隐藏 loading ========
  function hideLoading() {
    var loading = document.getElementById('loading-screen');
    if (loading && loading.style.display !== 'none') {
      loading.classList.add('hidden');
      setTimeout(function() { loading.style.display = 'none'; }, 500);
    }
  }
  window.addEventListener('load', function() {
    setTimeout(hideLoading, 2000);
  });
  document.addEventListener('live2d-loaded', hideLoading);
  // 强制安全隐藏：5秒后无论模型是否加载成功都隐藏loading
  setTimeout(hideLoading, 5000);
  </script>

  <!-- Flutter 应用入口（使用 defer，确保在 live2d-loader.js 之后执行） -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
