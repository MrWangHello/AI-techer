<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AI English Teacher - 3D Pet Companion">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI English Teacher">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI English Teacher</title>
  <link rel="manifest" href="manifest.json">

  <!-- Three.js r128 UMD (兼容所有浏览器，包括360/QQ) -->
  <script src="three.min.js"></script>
  <!-- GLTFLoader (加载 .glb 模型) -->
  <script src="GLTFLoader.js"></script>
  <!-- 3D 场景初始化和控制 -->
  <script src="three-loader.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* 微信浏览器引导遮罩 */
    #wechat-guide {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    #wechat-guide.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #wechat-guide h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    #wechat-guide p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    #wechat-guide .btn {
      display: inline-block;
      padding: 14px 40px;
      background: #07c160;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    #wechat-guide .tip {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!-- 微信浏览器引导页面 -->
  <div id="wechat-guide">
    <h2>&#128274; 请在浏览器中打开</h2>
    <p>当前页面在微信中无法正常显示 3D 内容。<br>
    请点击右上角 <strong>"..."</strong>，选择<br>
    <strong>"在浏览器中打开"</strong> 获得最佳体验。</p>
    <a class="btn" href="#" onclick="document.getElementById('wechat-guide').classList.remove('show'); return false;">我已了解，继续访问</a>
    <p class="tip">推荐使用 Chrome、QQ 浏览器或手机自带浏览器</p>
  </div>

  <script>
    // 微信浏览器检测
    function isWeChat() {
      var ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('micromessenger') !== -1;
    }
    if (isWeChat()) {
      document.getElementById('wechat-guide').classList.add('show');
    }
  </script>

  <!-- Flutter 应用入口 -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
