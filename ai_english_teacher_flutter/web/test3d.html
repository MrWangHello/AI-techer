<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; }
    h2 { text-align: center; padding: 16px; color: #333; }
    #status { text-align: center; padding: 8px; font-size: 14px; color: #666; }
    model-viewer {
      width: calc(100% - 32px);
      height: 60vh;
      margin: 0 16px;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      border-radius: 16px;
    }
    .btn-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; padding: 16px;
    }
    .btn-row button {
      padding: 10px 18px; border: none; border-radius: 12px;
      background: #e91e63; color: white; font-size: 14px; cursor: pointer;
    }
    .btn-row button:active { opacity: 0.7; }
    .info { padding: 16px; text-align: center; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h2>3D Pet Test</h2>
  <p id="status">Loading...</p>

  <model-viewer
    id="viewer"
    src="assets/models/RobotExpressive.glb"
    alt="3D Robot"
    camera-controls
    auto-rotate
    rotation-per-second="10deg"
    shadow-intensity="0.5"
    animation-name="Idle"
  ></model-viewer>

  <div class="btn-row">
    <button onclick="playAnim('Idle')">Idle</button>
    <button onclick="playAnim('Wave')">Wave</button>
    <button onclick="playAnim('Dance')">Dance</button>
    <button onclick="playAnim('Jump')">Jump</button>
    <button onclick="playAnim('Yes')">Yes</button>
    <button onclick="playAnim('No')">No</button>
    <button onclick="playAnim('ThumbsUp')">ThumbsUp</button>
    <button onclick="playAnim('Punch')">Punch</button>
  </div>

  <p class="info" id="info"></p>

  <script type="module">
    import 'https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const info = document.getElementById('info');

    viewer.addEventListener('load', () => {
      status.textContent = '✅ Model loaded!';
      status.style.color = 'green';
      const anims = viewer.availableAnimations || [];
      info.textContent = 'Animations: ' + anims.join(', ');
    });

    viewer.addEventListener('error', (e) => {
      status.textContent = '❌ Error: ' + (e.detail?.message || 'unknown');
      status.style.color = 'red';
    });

    window.playAnim = function(name) {
      viewer.animationName = name;
      status.textContent = 'Playing: ' + name;
    };
  </script>
</body>
</html>
