<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; }
    h2 { text-align: center; padding: 16px; color: #333; }
    #status { text-align: center; padding: 8px; font-size: 14px; color: #666; }
    model-viewer {
      width: calc(100% - 32px);
      height: 60vh;
      margin: 0 16px;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      border-radius: 16px;
    }
    .btn-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; padding: 16px;
    }
    .btn-row button {
      padding: 10px 18px; border: none; border-radius: 12px;
      background: #e91e63; color: white; font-size: 14px; cursor: pointer;
    }
    .btn-row button:active { opacity: 0.7; }
    .info { padding: 16px; text-align: center; font-size: 13px; color: #888; }
    .log { padding: 8px 16px; font-size: 12px; color: #999; word-break: break-all; }
  </style>
</head>
<body>
  <h2>3D Pet Test</h2>
  <p id="status">Loading...</p>

  <!-- Use model-viewer's official sample model (guaranteed to work) -->
  <model-viewer
    id="viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="3D Astronaut"
    camera-controls
    auto-rotate
    rotation-per-second="10deg"
    shadow-intensity="0.5"
  ></model-viewer>

  <div class="btn-row">
    <button onclick="switchModel('astronaut')">Astronaut</button>
    <button onclick="switchModel('robot')">Robot</button>
    <button onclick="switchModel('horse')">Horse</button>
  </div>

  <p class="info" id="info"></p>
  <p class="log" id="log"></p>

  <script type="module">
    import 'https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const log = document.getElementById('log');

    const models = {
      astronaut: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
      robot: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb',
      horse: 'https://modelviewer.dev/shared-assets/models/Horse.glb',
    };

    function logMsg(msg) {
      log.textContent = msg;
      console.log('[3D Test]', msg);
    }

    viewer.addEventListener('load', () => {
      status.textContent = '✅ Model loaded!';
      status.style.color = 'green';
      const anims = viewer.availableAnimations || [];
      info.textContent = 'Animations: ' + anims.join(', ');
      logMsg('Load OK at ' + new Date().toLocaleTimeString());
    });

    viewer.addEventListener('error', (e) => {
      const detail = e.detail || {};
      const msg = detail.message || detail.type || JSON.stringify(detail) || 'unknown';
      status.textContent = '❌ Error: ' + msg;
      status.style.color = 'red';
      logMsg('Error: ' + msg + ' | src=' + viewer.src);
    });

    viewer.addEventListener('progress', (e) => {
      const pct = Math.round(e.detail.totalProgress * 100);
      logMsg('Loading... ' + pct + '%');
    });

    window.switchModel = function(name) {
      viewer.src = models[name];
      status.textContent = 'Loading ' + name + '...';
      status.style.color = '#666';
      info.textContent = '';
    };
  </script>
</body>
</html>
